[package]
name = "sentryusb-manager-link"
version = "0.1.0"
edition = "2024"

# The management link to Sentry Manager: the Pi connects out over WSS,
# both sides prove a shared key, and Manager's requests run in-process
# against the allowlisted part of the API router.
# Contract: docs/sentry-manager-link.md.

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["json", "tokio"] }
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"
ring = "0.17"
hex = "0.4"
base64 = "0.22"
# rustls on ring, the same stack reqwest uses here; no OpenSSL.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# Only the WebSocket handshake: TLS is set up here so the pinning verifier
# and the seen fingerprint stay under this crate's control.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

sentryusb-config = { path = "../config", package = "sentryusb-config" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
